<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vertex Learning Hub | Mathematics & Physics Expert Coaching</title>
  <meta name="description" content="Live & recorded classes for school and college students in Mathematics and Physics. Clear concepts. Strong foundations. Better results." />
  <meta name="keywords" content="mathematics tutor, physics tutor, online coaching, JSS1 SSS2, exam preparation, algebra, calculus, mechanics" />
  <meta property="og:title" content="Vertex Learning Hub" />
  <meta property="og:description" content="Master Mathematics & Physics with Expert Guidance" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0a1628;
      --deep: #0d1f3c;
      --gold: #c9a84c;
      --gold-light: #e8c96d;
      --white: #f8f6f1;
      --muted: #8a9ab5;
      --accent: #1e3a5f;
      --card-bg: #111e35;
      --border: rgba(201,168,76,0.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,22,40,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 5%;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .logo span { color: var(--white); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      background: var(--gold); color: var(--navy);
      padding: 0.5rem 1.4rem; border-radius: 4px;
      text-decoration: none; font-weight: 600; font-size: 0.9rem;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--gold-light); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 24px; height: 2px; background: var(--gold); border-radius: 2px; transition: 0.3s; }
    .mobile-menu {
      display: none; position: fixed; top: 65px; left: 0; right: 0;
      background: var(--deep); border-bottom: 1px solid var(--border);
      padding: 1.5rem 5%; z-index: 99;
    }
    .mobile-menu.open { display: block; }
    .mobile-menu a {
      display: block; padding: 0.7rem 0;
      color: var(--muted); text-decoration: none;
      font-size: 1rem; border-bottom: 1px solid var(--border);
    }
    .mobile-menu a:hover { color: var(--gold); }

    /* ── SECTIONS ── */
    section { padding: 6rem 5%; }
    .section-label {
      font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--gold); font-weight: 600; margin-bottom: 0.8rem;
    }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; margin-bottom: 1rem; }
    .gold { color: var(--gold); }
    .divider {
      width: 60px; height: 3px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin: 1.5rem 0 2.5rem;
    }

    /* ── HERO ── */
    #home {
      min-height: 100vh;
      display: flex; align-items: center;
      padding-top: 100px;
      position: relative; overflow: hidden;
    }
    .hero-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 4rem; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(201,168,76,0.1); border: 1px solid var(--border);
      padding: 0.4rem 1rem; border-radius: 50px;
      font-size: 0.8rem; color: var(--gold); font-weight: 500;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s ease both;
    }
    h1 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900; line-height: 1.15;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s 0.1s ease both;
    }
    .hero-sub {
      font-size: 1.1rem; color: var(--muted);
      max-width: 480px; margin-bottom: 2.5rem;
      animation: fadeUp 0.6s 0.2s ease both;
    }
    .hero-btns {
      display: flex; flex-wrap: wrap; gap: 1rem;
      animation: fadeUp 0.6s 0.3s ease both;
    }
    .btn-primary {
      background: var(--gold); color: var(--navy);
      padding: 0.85rem 1.8rem; border-radius: 5px;
      text-decoration: none; font-weight: 700; font-size: 0.95rem;
      transition: all 0.2s; border: none; cursor: pointer;
    }
    .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); }
    .btn-outline {
      border: 1px solid var(--gold); color: var(--gold);
      padding: 0.85rem 1.8rem; border-radius: 5px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      transition: all 0.2s; background: transparent; cursor: pointer;
    }
    .btn-outline:hover { background: rgba(201,168,76,0.1); transform: translateY(-2px); }
    .hero-visual {
      display: flex; justify-content: center; align-items: center;
      animation: fadeUp 0.6s 0.4s ease both;
    }
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem;
      position: relative; width: 100%; max-width: 380px;
    }
    .hero-card::before {
      content: ''; position: absolute;
      top: -1px; left: 30px; right: 30px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .hero-stat {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 0; border-bottom: 1px solid var(--border);
    }
    .hero-stat:last-child { border-bottom: none; }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(201,168,76,0.1); display: flex;
      align-items: center; justify-content: center; font-size: 1.3rem;
      flex-shrink: 0;
    }
    .stat-text { font-size: 0.9rem; color: var(--muted); }
    .stat-val { font-weight: 700; color: var(--white); font-size: 1.05rem; }
    .hero-bg-shape {
      position: absolute; top: 10%; right: -5%;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── HIGHLIGHTS ── */
    #highlights { background: var(--deep); padding: 4rem 5%; }
    .highlights-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem; max-width: 1100px; margin: 0 auto;
    }
    .highlight-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.5rem;
      text-align: center; transition: transform 0.2s, border-color 0.2s;
    }
    .highlight-card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .highlight-card .icon { font-size: 1.8rem; margin-bottom: 0.8rem; }
    .highlight-card p { font-size: 0.9rem; color: var(--muted); font-weight: 500; }

    /* ── ABOUT ── */
    #about { max-width: 900px; margin: 0 auto; }
    .about-text { font-size: 1.1rem; color: var(--muted); line-height: 1.9; }
    .mission-box {
      background: var(--card-bg); border-left: 3px solid var(--gold);
      padding: 1.5rem 2rem; border-radius: 0 8px 8px 0;
      margin-top: 2rem;
    }
    .mission-box p { color: var(--white); font-style: italic; font-size: 1.05rem; }

    /* ── COURSES ── */
    #courses { background: var(--deep); }
    .courses-intro { max-width: 650px; margin-bottom: 3rem; }
    .tab-btns {
      display: flex; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap;
    }
    .tab-btn {
      padding: 0.65rem 1.6rem; border-radius: 5px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif; font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 700;
    }
    .courses-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .course-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.8rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .course-card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .course-tag {
      display: inline-block; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0.25rem 0.75rem; border-radius: 3px;
      background: rgba(201,168,76,0.15); color: var(--gold);
      font-weight: 600; margin-bottom: 1rem;
    }
    .course-card h3 {
      font-size: 1.25rem; margin-bottom: 0.6rem; color: var(--white);
    }
    .course-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
    .course-meta {
      display: flex; gap: 1.2rem; margin-bottom: 1.2rem; flex-wrap: wrap;
    }
    .course-meta span {
      font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem;
    }
    .course-price {
      font-size: 1.4rem; font-weight: 700; color: var(--gold);
      margin-bottom: 1rem;
    }
    .course-price small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
    .syllabus { margin-bottom: 1.5rem; }
    .syllabus p { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.4rem; display: flex; align-items: flex-start; gap: 0.5rem; }
    .syllabus p::before { content: '→'; color: var(--gold); flex-shrink: 0; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── INSTRUCTOR ── */
    #instructor { background: var(--navy); }
    .instructor-grid {
      display: grid; grid-template-columns: 1fr 2fr;
      gap: 4rem; align-items: start; max-width: 1000px;
    }
    .instructor-photo {
      width: 100%; aspect-ratio: 3/4;
      background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem;
      position: relative; overflow: hidden;
    }
    .instructor-photo::before {
      content: ''; position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.05), transparent);
    }
    .photo-placeholder { font-size: 5rem; }
    .photo-note { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 0 1rem; }
    .instructor-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; font-weight: 700; margin-bottom: 0.3rem;
    }
    .instructor-title { color: var(--gold); font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem; }
    .qual-list { list-style: none; margin-bottom: 2rem; }
    .qual-list li {
      padding: 0.4rem 0; color: var(--muted); font-size: 0.95rem;
      display: flex; align-items: center; gap: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .qual-list li::before { content: '◆'; color: var(--gold); font-size: 0.5rem; }
    .philosophy-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.5rem 2rem; position: relative;
    }
    .philosophy-box::before {
      content: '"'; position: absolute; top: -0.5rem; left: 1.5rem;
      font-family: 'Playfair Display', serif; font-size: 4rem;
      color: var(--gold); line-height: 1;
    }
    .philosophy-box p { color: var(--white); font-style: italic; font-size: 1rem; padding-top: 1rem; }

    /* ── SCHEDULE ── */
    #schedule { background: var(--deep); }
    .schedule-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem; max-width: 1000px;
    }
    .schedule-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.8rem;
    }
    .schedule-card h3 {
      font-size: 1.1rem; color: var(--gold); margin-bottom: 1rem;
    }
    .schedule-row {
      display: flex; justify-content: space-between;
      padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.88rem;
    }
    .schedule-row:last-child { border-bottom: none; }
    .schedule-row .label { color: var(--muted); }
    .schedule-row .val { color: var(--white); font-weight: 500; }

    /* ── MATERIALS ── */
    #materials { background: var(--navy); }
    .materials-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem; max-width: 1000px;
    }
    .material-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.8rem; text-align: center;
      transition: all 0.2s;
    }
    .material-card:hover { border-color: var(--gold); transform: translateY(-3px); }
    .material-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .material-card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
    .material-card p { font-size: 0.85rem; color: var(--muted); }

    /* ── TESTIMONIALS ── */
    #testimonials { background: var(--deep); }
    .testimonials-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem; max-width: 1100px;
    }
    .testimonial-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.8rem; position: relative;
    }
    .testimonial-card::before {
      content: '"'; position: absolute; top: 1rem; right: 1.5rem;
      font-family: 'Playfair Display', serif; font-size: 3rem;
      color: rgba(201,168,76,0.2); line-height: 1;
    }
    .stars { color: var(--gold); font-size: 0.9rem; margin-bottom: 0.8rem; }
    .testimonial-card p { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.2rem; font-style: italic; }
    .testimonial-author { font-weight: 700; color: var(--white); font-size: 0.9rem; }
    .testimonial-grade { font-size: 0.8rem; color: var(--gold); }

    /* ── FAQ ── */
    #faq { background: var(--navy); }
    .faq-list { max-width: 750px; }
    .faq-item {
      border-bottom: 1px solid var(--border); padding: 1.5rem 0;
    }
    .faq-q {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; color: var(--white); font-weight: 600; font-size: 1rem;
      gap: 1rem;
    }
    .faq-q span.arrow {
      color: var(--gold); font-size: 1.2rem; transition: transform 0.3s; flex-shrink: 0;
    }
    .faq-a {
      color: var(--muted); font-size: 0.92rem; max-height: 0;
      overflow: hidden; transition: max-height 0.4s ease, padding 0.3s;
    }
    .faq-item.open .faq-a { max-height: 200px; padding-top: 1rem; }
    .faq-item.open .arrow { transform: rotate(45deg); }

    /* ── PRICING ── */
    #pricing { background: var(--deep); }
    .pricing-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.5rem; max-width: 950px;
    }
    .pricing-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem; text-align: center;
      transition: all 0.2s; position: relative;
    }
    .pricing-card.featured {
      border-color: var(--gold);
      background: linear-gradient(135deg, var(--card-bg), rgba(201,168,76,0.07));
    }
    .featured-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: var(--gold); color: var(--navy);
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.25rem 1rem; border-radius: 20px;
    }
    .pricing-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .pricing-amount {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem; font-weight: 900; color: var(--gold);
      margin: 1.5rem 0 0.3rem;
    }
    .pricing-period { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .pricing-features { list-style: none; text-align: left; margin-bottom: 2rem; }
    .pricing-features li {
      padding: 0.5rem 0; font-size: 0.9rem; color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex; gap: 0.6rem; align-items: flex-start;
    }
    .pricing-features li::before { content: '✓'; color: var(--gold); font-weight: 700; flex-shrink: 0; }
    .discount-note {
      background: rgba(201,168,76,0.1); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem 1.5rem; max-width: 600px;
      margin-top: 2rem; font-size: 0.9rem; color: var(--muted);
    }
    .discount-note strong { color: var(--gold); }

    /* ── CONTACT ── */
    #contact { background: var(--navy); }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 4rem; max-width: 1000px; align-items: start;
    }
    .contact-info h3 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    .contact-item {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 0; border-bottom: 1px solid var(--border);
    }
    .contact-item .c-icon {
      width: 42px; height: 42px; background: rgba(201,168,76,0.1);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .contact-item .c-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .contact-item .c-val { color: var(--white); font-weight: 500; font-size: 0.95rem; }
    .contact-item a { color: var(--gold); text-decoration: none; }
    .contact-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    .contact-form h3 { font-size: 1.3rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.83rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: var(--navy);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.75rem 1rem; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 0.93rem;
      transition: border-color 0.2s; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--gold);
    }
    .form-group textarea { resize: vertical; min-height: 110px; }
    .form-group select option { background: var(--navy); }

    /* ── FOOTER ── */
    footer {
      background: var(--deep); border-top: 1px solid var(--border);
      padding: 3rem 5% 2rem;
    }
    .footer-grid {
      display: grid; grid-template-columns: 2fr 1fr 1fr;
      gap: 3rem; max-width: 1100px; margin: 0 auto 2rem;
    }
    .footer-brand .logo { font-size: 1.5rem; display: block; margin-bottom: 1rem; }
    .footer-brand p { color: var(--muted); font-size: 0.9rem; max-width: 300px; }
    .footer-col h4 { color: var(--gold); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .footer-col a {
      display: block; color: var(--muted); text-decoration: none;
      font-size: 0.9rem; padding: 0.3rem 0; transition: color 0.2s;
    }
    .footer-col a:hover {
